global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: job-queue-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: job-queue-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:2112"]
